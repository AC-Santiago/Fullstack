<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mi primer HTML</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <main>
            <div class="display_block">
                <div class="cajas_1 display_inline_block"> Ejemplo 1</div>
                <div class="cajas_2 display_inline_block"> Ejemplo 2</div>
                <div class="cajas_3 display_inline"> Ejemplo 3</div>
                <div class="cajas_4 display_inline"> Ejemplo 4</div>
            </div>
            <!--Sección de bienvenida-->
            <section>
                <div class="estilo_titulo">
                    <h1 class="estilo_titulo">Bienvenido a mi primer proyecto web</h1>
                    <p class="estilo_parrafo">Este es mi primer proyecto web deonde podras encontrar
                        imagenes y videos que puedas disfrutar un rato.
                    </p>
                    <input placeholder="Escribe tun hombre">
                    <p>Autor: Santiago Acosta Cespedes</p>
                </div>
            </section>
            <!--Sección de imagenes-->
            <h3>Imagenes divertidas</h3>
            <figure>
                <img src="images/chimuelo.jpg" alt="chimuelo">
                <figcaption>El mejor dragon de todos</figcaption>
            </figure>
            <figure>
                <img src="images/doglindo.jpg" alt="perro lindo">
                <figcaption>Es un perro lindo</figcaption>
            </figure>
            <figure>
                <img src="images/Dominic.jpg" alt="Dominic">
                <figcaption>Uno de los mejores personajes de Gears</figcaption>
            </figure>
            <figure>
                <img src="images/marcus.jpg" alt="marcus">
                <figcaption>El mejor</figcaption>
            </figure>
            <figure>
                <img src="images/RustLang.png" alt="Rust Lang">
                <figcaption>Un buen lenguage</figcaption>
            </figure>
            <figure>
                <img src="images/peque master.jpg" alt="Jefe maestro">
                <figcaption>Jefe maestro peque</figcaption>
            </figure>
            <!--Sección de videos-->
            <h3>Videos aleatorios</h3>
            <figure>
                <video controls preload="auto">
                    <source src="videos/hombre cominando.mp4" type="video/mp4">
                </video>
            </figure>
            <figure>
                <video controls preload="auto">
                    <source src="videos/naturaleza.mp4" type="video/mp4">
                </video>
            </figure>
            <figure>
                <video controls preload="auto">
                    <source src="videos/vertical.mp4" type="video/mp4">
                </video>
            </figure>

        </main>

    </body>

</html>
